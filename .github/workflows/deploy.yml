name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Cheap gate first — fail in seconds before spending time on browsers.
      - name: Typecheck and lint
        run: npm run typecheck && npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        # Uses the Supabase Management API (HTTPS) rather than a direct Postgres
        # connection — the direct host resolves to IPv6 which GitHub Actions can't reach.
        # All migrations are idempotent so re-running them is always safe.
        # Error detection: the API returns an array on success and an object on failure
        # (e.g. {"message":"...", "code":"..."}) — checking type == "object" catches all
        # error shapes regardless of which key the message is in.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          # Fail fast with a clear message if a required secret is missing/empty.
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings → Secrets}"
          : "${VITE_SUPABASE_URL:?VITE_SUPABASE_URL secret is not set — add it in repo Settings → Secrets}"
          PROJECT_REF=$(echo "$VITE_SUPABASE_URL" | grep -oP 'https://\K[^.]+')
          echo "Applying migrations to project: $PROJECT_REF"
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $(basename $f)"
            response=$(jq -n --rawfile q "$f" '{query: $q}' | \
              curl -sf \
                -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d @-)
            if echo "$response" | jq -e 'type == "object"' > /dev/null 2>&1; then
              echo "Migration failed: $(echo "$response" | jq -r '.message // .error // .')"
              exit 1
            fi
            echo "  ✓ applied"
          done

      - name: Verify table grants (RLS guard)
        # Mocked unit/E2E tests can't catch missing GRANTs/RLS — this asserts against the
        # real DB that the `authenticated` role has the privileges the app depends on.
        # Turns "permission denied for table books" into a red deploy instead of a prod bug.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          PROJECT_REF=$(echo "$VITE_SUPABASE_URL" | grep -oP 'https://\K[^.]+')
          SQL="select bool_and(ok) as all_ok from ("
          SQL+="select has_table_privilege('authenticated','public.books','INSERT') as ok"
          SQL+=" union all select has_table_privilege('authenticated','public.books','UPDATE')"
          SQL+=" union all select has_table_privilege('authenticated','public.user_books','INSERT')"
          SQL+=" union all select has_table_privilege('authenticated','public.user_books','SELECT')"
          SQL+=" union all select has_table_privilege('authenticated','public.profiles','UPDATE')"
          SQL+=" union all select has_table_privilege('service_role','public.profiles','SELECT')"
          SQL+=" union all select has_table_privilege('service_role','public.profiles','UPDATE')"
          SQL+=" union all select has_table_privilege('service_role','public.user_books','SELECT')"
          SQL+=" union all select has_table_privilege('service_role','public.chat_messages','SELECT')) t;"
          response=$(jq -n --arg q "$SQL" '{query: $q}' | \
            curl -sf \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-)
          echo "$response"
          if [ "$(echo "$response" | jq -r '.[0].all_ok')" != "true" ]; then
            echo "ERROR: 'authenticated' or 'service_role' is missing required table privileges."
            echo "Check supabase/migrations/003_grants.sql (authenticated/anon) and"
            echo "009_service_role_grants.sql (service_role / Edge Functions) applied successfully."
            exit 1
          fi
          echo "✓ table grants verified"

      - name: Set Edge Function secrets
        # Sets GOOGLE_API_KEY for the Edge Function. Skips gracefully if the GitHub
        # secret isn't set yet (Supabase secrets persist across deploys, so a one-time
        # manual `supabase secrets set` is also sufficient).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "⚠ GOOGLE_API_KEY GitHub secret not set — skipping (relying on existing Supabase secret)."
            exit 0
          fi
          PROJECT_REF=$(echo "$VITE_SUPABASE_URL" | grep -oP 'https://\K[^.]+')
          npx supabase@latest secrets set GOOGLE_API_KEY="$GOOGLE_API_KEY" --project-ref "$PROJECT_REF"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          PROJECT_REF=$(echo "$VITE_SUPABASE_URL" | grep -oP 'https://\K[^.]+')
          npx supabase@latest functions deploy librarian --project-ref "$PROJECT_REF"

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          echo "Testing $url"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Site is up at $url"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: $url did not return 200 after 2 minutes"
          exit 1
